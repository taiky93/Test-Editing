<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: Montserrat; font-weight: 600; font-display: block; src: url("assets/fonts/montserrat-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: Montserrat; font-weight: 800; font-display: block; src: url("assets/fonts/montserrat-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: Montserrat; font-weight: 900; font-display: block; src: url("assets/fonts/montserrat-latin-900-normal.woff2") format("woff2"); }
      :root {
        --accent: #ffd400;
        --ink: #ffffff;
        --red: #e8352b;
        --bg: #12060a;
        --glow: rgba(232, 53, 43, 0.5);
        --outline: 3.0px 0.0px 0 #000, 2.1px 2.1px 0 #000, 0.0px 3.0px 0 #000, -2.1px 2.1px 0 #000, -3.0px 0.0px 0 #000, -2.1px -2.1px 0 #000, -0.0px -3.0px 0 #000, 2.1px -2.1px 0 #000, 6.0px 0.0px 0 #000, 5.5px 2.3px 0 #000, 4.2px 4.2px 0 #000, 2.3px 5.5px 0 #000, 0.0px 6.0px 0 #000, -2.3px 5.5px 0 #000, -4.2px 4.2px 0 #000, -5.5px 2.3px 0 #000, -6.0px 0.0px 0 #000, -5.5px -2.3px 0 #000, -4.2px -4.2px 0 #000, -2.3px -5.5px 0 #000, -0.0px -6.0px 0 #000, 2.3px -5.5px 0 #000, 4.2px -4.2px 0 #000, 5.5px -2.3px 0 #000, 0 6px 10px rgba(0,0,0,0.5);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; font-family: Montserrat, sans-serif; overflow: hidden; }
      #stage { position: absolute; inset: 0; background: radial-gradient(ellipse 95% 60% at 50% 34%, #3a0d14 0%, #1d0710 50%, var(--bg) 100%); }
      #dots {
        position: absolute; left: -40px; top: -40px; width: 1160px; height: 2000px; opacity: 0.16;
        background-image: radial-gradient(circle, #ff5a4f 2.6px, transparent 3px); background-size: 34px 34px;
      }
      #halo {
        position: absolute; left: 90px; top: 110px; width: 900px; height: 1120px; border-radius: 50%;
        background: radial-gradient(ellipse at center, var(--glow) 0%, rgba(232,53,43,0.12) 45%, rgba(232,53,43,0) 70%);
      }
      .scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
      .card { position: absolute; border-radius: 4.6%/3.3%; box-shadow: 0 26px 60px rgba(0,0,0,0.7), 0 0 0 3px rgba(255,255,255,0.08); }
      .tags { position: absolute; left: 40px; right: 40px; top: 1105px; display: flex; justify-content: center; gap: 30px; z-index: 4; }
      .pair-tags { justify-content: space-around; }
      .tag {
        padding: 12px 26px 10px; border-radius: 14px; white-space: nowrap;
        font-weight: 900; font-size: 42px; color: #111; background: var(--accent);
        box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      }
      #badge {
        position: absolute; left: 56px; top: 64px; z-index: 5;
        padding: 14px 26px 12px;
        background: var(--red); color: #fff;
        font-weight: 900; font-size: 40px; letter-spacing: 0.04em;
        border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        opacity: 0; visibility: hidden;
      }
      #captions { position: absolute; left: 60px; right: 60px; top: 1250px; height: 330px; z-index: 6; }
      .chunk {
        position: absolute; left: 0; right: 0; top: 0;
        text-align: center;
        font-weight: 900; font-size: 84px; line-height: 1.12;
        color: var(--ink); text-shadow: var(--outline);
        opacity: 0; visibility: hidden;
      }
      .w { display: inline-block; margin: 0 0.2em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="96.6" data-width="1080" data-height="1920">
      <audio id="voice" src="audio/voiceover.mp3" data-start="0" data-duration="95.53" data-track-index="3"></audio>
      <audio id="bed" src="audio/bed.wav" data-start="0" data-duration="96.6" data-volume="0.28" data-track-index="4"></audio>
      <div id="stage" class="clip" data-start="0" data-duration="96.6" data-track-index="0">
        <div id="dots"></div>
        <div id="halo"></div>
        <div id="scenes"></div>
        <div id="badge">NEWS MAGIC</div>
        <div id="captions"></div>
      </div>
    </div>
    <script>
      // Timings come from audio/words.json (Whisper) and scenes.json — no timing is written here.
      const load = (p) => { const r = new XMLHttpRequest(); r.open("GET", p, false); r.send(null); return JSON.parse(r.responseText); };
      const words = load("audio/words.json");
      const scenes = load("scenes.json");
      const TOTAL = scenes.duration;
      const RATIO = 1040 / 745;

      // ---- Card layouts: [x, y, width, rotation] for each card of a scene ----
      const LAYOUTS = {
        single: () => [[190, 150, 700, 0]],
        pair: () => [[55, 330, 470, -3], [555, 330, 470, 3]],
        fan: () => [[85, 300, 410, -12], [335, 230, 410, 0], [585, 300, 410, 12]],
        grid: (n) => Array.from({ length: n }, (_, i) => [179 + (i % 3) * 246, 160 + Math.floor(i / 3) * 335, 230, 0]),
      };
      const scenesEl = document.getElementById("scenes");
      scenes.foci.forEach((s, si) => {
        const el = document.createElement("div");
        el.className = "scene";
        el.id = "sc-" + si;
        LAYOUTS[s.layout](s.cards.length).forEach(([x, y, w, r], ci) => {
          const img = document.createElement("img");
          img.className = "card";
          img.id = `sc-${si}-c${ci}`;
          img.src = `assets/cards/${s.cards[ci]}.png`;
          img.alt = s.cards[ci];
          Object.assign(img.style, { left: x + "px", top: y + "px", width: w + "px", height: w * RATIO + "px", zIndex: s.layout === "fan" && ci === 1 ? 2 : 1 });
          img.dataset.rot = r;
          el.appendChild(img);
        });
        if (s.tags.length) {
          const tags = document.createElement("div");
          tags.className = "tags" + (s.layout === "pair" && s.tags.length === 2 ? " pair-tags" : "");
          if (s.layout === "grid") tags.style.top = "1160px";
          tags.id = `sc-${si}-tags`;
          s.tags.forEach((t) => { const d = document.createElement("div"); d.className = "tag"; d.textContent = t; tags.appendChild(d); });
          el.appendChild(tags);
        }
        scenesEl.appendChild(el);
      });

      // ---- Captions: group words into short TikTok-style chunks ----
      const chunks = [];
      let cur = [];
      words.forEach((w, i) => {
        cur.push(w);
        const next = words[i + 1];
        const strong = /[.:;!?…]$/.test(w.text);
        const comma = /,$/.test(w.text) && w.end - cur[0].start > 0.6;
        const chars = cur.map((x) => x.text).join(" ").length;
        if (!next || strong || comma || cur.length >= 4 || chars > 16 || next.line !== w.line || next.start - w.end > 0.35) { chunks.push(cur); cur = []; }
      });
      const capEl = document.getElementById("captions");
      chunks.forEach((c, ci) => {
        const el = document.createElement("div");
        el.className = "chunk";
        el.id = "chunk-" + ci;
        c.forEach((w, wi) => {
          const s = document.createElement("span");
          s.className = "w";
          s.id = `w-${ci}-${wi}`;
          s.textContent = w.text;
          el.appendChild(s);
        });
        capEl.appendChild(el);
      });

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#dots", { y: 0 }, { y: 68, duration: TOTAL, ease: "none" }, 0);
      tl.fromTo("#halo", { opacity: 0.7 }, { opacity: 1, duration: 2, ease: "sine.inOut", yoyo: true, repeat: Math.floor(TOTAL / 2) - 1 }, 0);
      tl.fromTo("#badge", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "back.out(2)" }, 0.2);

      // ---- Scenes: cards fly in (staggered), slow push-in while the voice talks, quick exit ----
      scenes.foci.forEach((s, si) => {
        const start = s.t;
        const end = scenes.foci[si + 1] ? scenes.foci[si + 1].t : TOTAL;
        const id = "#sc-" + si;
        tl.set(id, { autoAlpha: 1 }, Math.max(0, start - 0.3));
        const stagger = s.layout === "grid" ? 0.05 : 0.12;
        s.cards.forEach((_, ci) => {
          const c = `#sc-${si}-c${ci}`;
          const rot = +document.querySelector(c).dataset.rot;
          tl.fromTo(c, { autoAlpha: 0, y: 420, rotation: rot * 2 + (ci % 2 ? 8 : -8), scale: 0.8 },
            { autoAlpha: 1, y: 0, rotation: rot, scale: 1, duration: 0.6, ease: "back.out(1.3)", immediateRender: false }, Math.max(0, start - 0.3) + ci * stagger);
          if (s.layout === "single") tl.to(c, { scale: 1.05, duration: Math.max(0.5, end - start - 0.8), ease: "none" }, start + 0.4);
        });
        if (s.tags.length) {
          tl.fromTo(`#sc-${si}-tags`, { autoAlpha: 0, y: 24, scale: 0.9 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, start + 0.35);
        }
        if (scenes.foci[si + 1]) {
          tl.to(id, { autoAlpha: 0, scale: 0.94, duration: 0.3, ease: "power2.in" }, end - 0.32);
        }
      });

      // ---- Captions timing: one chunk at a time, spoken word in yellow ----
      chunks.forEach((c, ci) => {
        const start = c[0].start - 0.04;
        const nextStart = chunks[ci + 1] ? chunks[ci + 1][0].start - 0.04 : TOTAL;
        const lastEnd = c[c.length - 1].end;
        const end = nextStart - lastEnd < 0.7 ? nextStart : lastEnd + 0.35;
        const id = "#chunk-" + ci;
        tl.fromTo(id, { autoAlpha: 0, y: 14, scale: 0.94 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.12, ease: "power2.out" }, start);
        tl.set(id, { autoAlpha: 0 }, end);
        c.forEach((w, wi) => {
          const s = `#w-${ci}-${wi}`;
          const wEnd = c[wi + 1] ? c[wi + 1].start : Math.min(end, w.end + 0.25);
          tl.to(s, { color: "#ffd400", scale: 1.05, duration: 0.06, ease: "none" }, w.start);
          tl.to(s, { color: "#ffffff", scale: 1, duration: 0.06, ease: "none" }, Math.max(w.start + 0.07, wEnd));
        });
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
